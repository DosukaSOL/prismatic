org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
# This project deliberately uses only platform APIs (no AndroidX / Jetpack).
android.useAndroidX=false
kotlin.code.style=official
# Only android-36 platform is installed on the build host; silence the
# "compileSdk not vetted" advisory. Safe: we target stable platform APIs.
android.suppressUnsupportedCompileSdk=36
